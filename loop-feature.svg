<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"
     font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- ===== Left: brand + tagline ===== -->
  <!-- infinity mark -->
  <g transform="translate(248,244)">
    <path d="M 0,0 C 0,-46 -46,-80 -100,-80 C -158,-80 -198,-40 -198,0
             C -198,40 -158,80 -100,80 C -46,80 0,46 0,0
             C 0,-46 46,-80 100,-80 C 158,-80 198,-40 198,0
             C 198,40 158,80 100,80 C 46,80 0,46 0,0 Z"
          fill="none" stroke="#FFFFFF" stroke-width="62"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="150" y="470" fill="#FFFFFF" font-size="150" font-weight="700"
        letter-spacing="-4">Loop</text>
  <text x="156" y="560" fill="#E0E7FF" font-size="50" font-weight="600">
    Points · Rewards · Referrals</text>
  <text x="156" y="630" fill="#C7D2FE" font-size="36" font-weight="400">
    Zero-code widget. No dark patterns.</text>

  <!-- ===== Right: widget panel mock ===== -->
  <g transform="translate(946,206)">
    <!-- soft shadow -->
    <rect x="14" y="20" width="520" height="500" rx="36" fill="#312E81" opacity="0.35"/>
    <!-- card -->
    <rect width="520" height="500" rx="36" fill="#FFFFFF"/>
    <!-- header -->
    <text x="44" y="86" fill="#111827" font-size="40" font-weight="700">Rewards</text>
    <!-- points -->
    <text x="44" y="196" fill="#4F46E5" font-size="92" font-weight="800">1,250</text>
    <text x="306" y="196" fill="#6B7280" font-size="34" font-weight="500">points</text>
    <line x1="44" y1="246" x2="476" y2="246" stroke="#EEF0F4" stroke-width="3"/>
    <!-- reward row 1 -->
    <text x="44" y="312" fill="#111827" font-size="34" font-weight="600">$5 off</text>
    <text x="44" y="352" fill="#6B7280" font-size="26">500 pt</text>
    <rect x="356" y="284" width="120" height="62" rx="31" fill="#4F46E5"/>
    <text x="416" y="324" fill="#FFFFFF" font-size="28" font-weight="600" text-anchor="middle">Redeem</text>
    <line x1="44" y1="386" x2="476" y2="386" stroke="#EEF0F4" stroke-width="3"/>
    <!-- reward row 2 -->
    <text x="44" y="452" fill="#111827" font-size="34" font-weight="600">$10 off</text>
    <text x="44" y="492" fill="#6B7280" font-size="26">1,000 pt</text>
    <rect x="356" y="424" width="120" height="62" rx="31" fill="#4F46E5"/>
    <text x="416" y="464" fill="#FFFFFF" font-size="28" font-weight="600" text-anchor="middle">Redeem</text>
  </g>

  <!-- launcher pill -->
  <g transform="translate(1320,724)">
    <rect width="190" height="76" rx="38" fill="#FFFFFF"/>
    <text x="36" y="50" fill="#4F46E5" font-size="34">★</text>
    <text x="74" y="50" fill="#111827" font-size="32" font-weight="600">Points</text>
  </g>
</svg>
